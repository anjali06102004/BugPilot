<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout — Broken Shop</title>
    <style>
      body { font-family: sans-serif; margin: 24px; }
      button { margin-top: 16px; padding: 12px 20px; }
    </style>
  </head>
  <body>
    <h1>Checkout</h1>
    <p>Place an order against the broken payment API.</p>
    <button id="pay">Pay now</button>
    <p id="status"></p>
    <script>
      document.getElementById("pay").addEventListener("click", async () => {
        await fetch("/api/broken", { method: "POST" });
      });
    </script>
  </body>
</html>
