[project]
name = "bugpilot"
version = "0.2.0"
description = "Agentic UI testing, bug intelligence and browser experience platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.30.0",
  "psycopg2-binary>=2.9.10",
  "greenlet>=3.1.0",
  "alembic>=1.14.0",
  "redis>=5.2.0",
  "playwright>=1.49.0",
  "langgraph>=0.2.50",
  "httpx>=0.27.0",
  "pillow>=11.0.0",
  "python-multipart>=0.0.17",
  "google-genai>=1.0.0",
  "openai>=1.55.0",
  "orjson>=3.10.0",
  "reportlab>=4.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[project.scripts]
bugpilot-api = "app.main:run"
bugpilot-worker = "worker.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["packages/core", "services/api", "services/browser-worker"]
filterwarnings = [
  "ignore::DeprecationWarning:pydantic.*",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", "migrations", "node_modules", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E501"]
"scripts/**" = ["E501"]
"packages/core/bugpilot_core/agent/dom_script.py" = ["E501"]
"packages/core/bugpilot_core/ai/prompts.py" = ["E501"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages/core", "services/api", "services/browser-worker"]